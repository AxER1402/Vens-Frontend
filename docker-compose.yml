services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: clinico_vascular_frontend
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    restart: unless-stopped
